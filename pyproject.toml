[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biomy"
version = "0.2.0"
description = "Auditable Ayurvedic herb-drug clinical intelligence and research-grade temporal pharmacokinetic state machine prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.2",
    "pydantic>=2.7",
    "scipy>=1.11",
    "numpy>=1.24",
]

[project.optional-dependencies]
app = ["streamlit>=1.40"]
test = ["pytest>=8.0"]
model = [
    "torch>=2.4",
    "transformers>=4.45",
    "peft>=0.13",
    "bitsandbytes>=0.43",
    "accelerate>=0.34",
]

[tool.setuptools.packages.find]
include = ["biomy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
